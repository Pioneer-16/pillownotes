<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导表管理 · AirDream</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --color-paper: #f6f3ec;
      --color-paper-warm: #f0ebe0;
      --color-paper-deep: #e8e1d3;
      --color-ink: #1a1a18;
      --color-ink-soft: #3d3d38;
      --color-ink-faint: #8a8a80;
      --color-ink-ghost: #b8b8ae;
      --color-bamboo: #2d5a3d;
      --color-bamboo-light: #3a7a52;
      --color-bamboo-mist: #e8f5e9;
      --color-cloud: #ffffff;
      --color-shadow: rgba(26, 26, 24, 0.06);
      --color-danger: #c0392b;
      --color-danger-bg: #fdecea;
      --font-display: "Noto Serif SC", "Source Han Serif SC", "楷体", KaiTi, Georgia, serif;
      --font-body: "Noto Sans SC", "Source Han Sans SC", "微软雅黑", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
      --radius: 8px;
      --radius-lg: 12px;
    }

    [data-theme="dark"] {
      --color-paper: #1e1d1b;
      --color-paper-warm: #2c2a27;
      --color-paper-deep: #3c3935;
      --color-ink: #e5e1da;
      --color-ink-soft: #b5b1a8;
      --color-ink-faint: #928f87;
      --color-ink-ghost: #706d67;
      --color-bamboo: #4faa70;
      --color-bamboo-light: #5fc085;
      --color-bamboo-mist: #1b3a25;
      --color-cloud: #262523;
      --color-shadow: rgba(0, 0, 0, 0.3);
      --color-danger: #e74c3c;
      --color-danger-bg: #3a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* 顶栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--color-cloud);
      border-bottom: 1px solid var(--color-paper-deep);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--color-ink);
      text-decoration: none;
    }

    .topbar-divider {
      width: 1px;
      height: 20px;
      background: var(--color-paper-deep);
    }

    .page-title {
      font-size: 15px;
      color: var(--color-ink-faint);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-ink-soft);
      transition: background 0.2s;
    }

    .btn-icon:hover { background: var(--color-paper-warm); }

    /* 主布局 */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* 侧边栏 */
    .sidebar {
      width: 260px;
      background: var(--color-cloud);
      border-right: 1px solid var(--color-paper-deep);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--color-paper-deep);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ink-soft);
    }

    .btn-new {
      width: 28px;
      height: 28px;
      border: 1px solid var(--color-paper-deep);
      background: var(--color-paper);
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-ink-soft);
      font-size: 16px;
      transition: all 0.2s;
    }

    .btn-new:hover {
      border-color: var(--color-bamboo);
      color: var(--color-bamboo);
      background: var(--color-bamboo-mist);
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .file-item:hover { background: var(--color-paper-warm); }

    .file-item.active {
      background: var(--color-bamboo-mist);
      color: var(--color-bamboo);
    }

    .file-item-name {
      font-size: 14px;
      font-weight: 500;
    }

    .file-item-meta {
      font-size: 11px;
      color: var(--color-ink-ghost);
    }

    .file-item-delete {
      opacity: 0;
      border: none;
      background: none;
      color: var(--color-danger);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .file-item:hover .file-item-delete { opacity: 0.6; }
    .file-item-delete:hover { opacity: 1 !important; background: var(--color-danger-bg); }

    /* 编辑区 */
    .editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--color-cloud);
      border-bottom: 1px solid var(--color-paper-deep);
      flex-shrink: 0;
    }

    .editor-toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .editor-toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 16px;
      border: 1px solid var(--color-paper-deep);
      background: var(--color-paper);
      color: var(--color-ink-soft);
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }

    .btn:hover {
      border-color: var(--color-bamboo);
      color: var(--color-bamboo);
    }

    .btn-primary {
      background: var(--color-bamboo);
      color: #fff;
      border-color: var(--color-bamboo);
    }

    .btn-primary:hover {
      background: var(--color-bamboo-light);
      border-color: var(--color-bamboo-light);
      color: #fff;
    }

    .btn-danger {
      color: var(--color-danger);
    }

    .btn-danger:hover {
      border-color: var(--color-danger);
      background: var(--color-danger-bg);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .save-status {
      font-size: 13px;
      color: var(--color-ink-faint);
      margin-right: 8px;
    }

    .save-status.saving { color: var(--color-bamboo); }
    .save-status.saved { color: var(--color-bamboo); }
    .save-status.error { color: var(--color-danger); }

    /* 表格 */
    .table-wrap {
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
    }

    .csv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .csv-table th {
      text-align: left;
      padding: 8px 12px;
      background: var(--color-paper-warm);
      border: 1px solid var(--color-paper-deep);
      font-weight: 600;
      font-size: 13px;
      color: var(--color-ink-soft);
      position: sticky;
      top: 0;
      z-index: 1;
      white-space: nowrap;
    }

    .csv-table td {
      padding: 0;
      border: 1px solid var(--color-paper-deep);
    }

    .csv-table tr:hover td {
      background: var(--color-bamboo-mist);
    }

    .csv-table input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: var(--font-mono);
      color: var(--color-ink);
      outline: none;
    }

    .csv-table input:focus {
      background: var(--color-cloud);
      box-shadow: inset 0 0 0 2px var(--color-bamboo);
    }

    .col-key { min-width: 200px; }
    .col-source { min-width: 250px; }
    .col-comment { min-width: 150px; }

    .row-actions {
      width: 40px;
      text-align: center;
    }

    .row-delete {
      border: none;
      background: none;
      color: var(--color-ink-ghost);
      cursor: pointer;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .row-delete:hover {
      color: var(--color-danger);
      background: var(--color-danger-bg);
    }

    .row-number {
      width: 40px;
      text-align: center;
      color: var(--color-ink-ghost);
      font-size: 12px;
      font-family: var(--font-mono);
      user-select: none;
    }

    /* 空状态 */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-ink-faint);
      gap: 16px;
    }

    .empty-state-icon {
      font-size: 48px;
      opacity: 0.4;
    }

    .empty-state-text {
      font-size: 15px;
    }

    /* 新建弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--color-cloud);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    }

    .modal h3 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .modal input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-paper-deep);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--color-paper);
      color: var(--color-ink);
      outline: none;
      margin-bottom: 16px;
    }

    .modal input:focus { border-color: var(--color-bamboo); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .hidden { display: none !important; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      background: var(--color-cloud);
      border: 1px solid var(--color-paper-deep);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px var(--color-shadow);
      font-size: 14px;
      z-index: 200;
      animation: toastIn 0.3s ease;
    }

    .toast.error { border-color: var(--color-danger); color: var(--color-danger); }
    .toast.success { border-color: var(--color-bamboo); color: var(--color-bamboo); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="logo" href="/">AirDream</a>
      <div class="topbar-divider"></div>
      <span class="page-title">导表管理</span>
    </div>
    <div class="topbar-actions">
      <button class="btn-icon" id="btn-theme" title="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
      </button>
      <button class="btn-icon" id="btn-home" title="返回工作台" onclick="location.href='/'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">字符串表</span>
        <button class="btn-new" id="btn-new" title="新建字符串表">+</button>
      </div>
      <div class="file-list" id="file-list">
        <div style="padding:20px; text-align:center; color:var(--color-ink-faint); font-size:13px;">加载中...</div>
      </div>
    </aside>

    <!-- 编辑区 -->
    <div class="editor" id="editor">
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-text">选择左侧文件开始编辑，或创建新的字符串表</div>
      </div>
      <div class="hidden" id="editor-content">
        <div class="editor-toolbar">
          <div class="editor-toolbar-left">
            <span id="editor-filename" style="font-weight:600; font-size:14px;"></span>
            <span class="save-status" id="save-status"></span>
          </div>
          <div class="editor-toolbar-right">
            <button class="btn" id="btn-add-row">+ 添加行</button>
            <button class="btn" id="btn-import-csv">导入 CSV</button>
            <button class="btn" id="btn-export-csv">导出 CSV</button>
            <button class="btn btn-primary" id="btn-save">保存</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="csv-table" id="csv-table">
            <thead>
              <tr id="table-header"></tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 新建弹窗 -->
  <div class="modal-overlay hidden" id="new-modal">
    <div class="modal">
      <h3>新建字符串表</h3>
      <input type="text" id="new-name" placeholder="例如：ST_Item（自动添加 ST_ 前缀）" autocomplete="off">
      <div class="modal-actions">
        <button class="btn" id="new-cancel">取消</button>
        <button class="btn btn-primary" id="new-confirm">创建</button>
      </div>
    </div>
  </div>

  <input type="file" id="csv-file-input" accept=".csv" class="hidden">

  <script>
    const API = window.location.origin;
    const token = localStorage.getItem('airdream_auth') || '';
    let files = [];
    let currentFile = null;
    let currentData = null;
    let isDirty = false;

    // 主题
    function loadTheme() {
      const saved = localStorage.getItem('airdream_theme') || 'auto';
      if (saved === 'auto') {
        document.documentElement.setAttribute('data-theme',
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-theme', saved);
      }
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('airdream_theme', next);
    }

    // Toast
    function showToast(msg, type = '') {
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
    }

    // 检查登录
    async function checkLogin() {
      if (!token) { location.href = '/'; return false; }
      try {
        const res = await fetch(API + '/api/auth/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token }
        });
        if (!res.ok) { location.href = '/'; return false; }
        return true;
      } catch (e) { location.href = '/'; return false; }
    }

    // 加载文件列表
    async function loadFiles() {
      try {
        const res = await fetch(API + '/api/stringtables', {
          headers: { 'X-Auth-Token': token }
        });
        if (!res.ok) throw new Error('加载失败');
        files = await res.json();
        renderFileList();
      } catch (e) {
        showToast('加载文件列表失败', 'error');
      }
    }

    function renderFileList() {
      const list = document.getElementById('file-list');
      if (files.length === 0) {
        list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--color-ink-faint); font-size:13px;">暂无文件，点击 + 创建</div>';
        return;
      }
      list.innerHTML = files.map(f => `
        <div class="file-item ${currentFile === f.name ? 'active' : ''}" data-name="${f.name}">
          <div>
            <div class="file-item-name">${escapeHtml(f.displayName)}</div>
            <div class="file-item-meta">${f.name}</div>
          </div>
          <button class="file-item-delete" data-name="${f.name}" title="删除">✕</button>
        </div>
      `).join('');

      list.querySelectorAll('.file-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('file-item-delete')) return;
          openFile(el.dataset.name);
        });
      });

      list.querySelectorAll('.file-item-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const name = btn.dataset.name;
          if (!confirm(`确定删除 ${name} 吗？`)) return;
          try {
            const res = await fetch(`${API}/api/stringtables/${encodeURIComponent(name)}`, {
              method: 'DELETE',
              headers: { 'X-Auth-Token': token }
            });
            if (res.ok) {
              showToast('已删除', 'success');
              if (currentFile === name) { currentFile = null; showEmpty(); }
              await loadFiles();
            } else {
              showToast('删除失败', 'error');
            }
          } catch (e) { showToast('删除失败', 'error'); }
        });
      });
    }

    // 打开文件
    async function openFile(name) {
      if (isDirty && !confirm('当前文件有未保存的修改，确定切换吗？')) return;
      try {
        const res = await fetch(`${API}/api/stringtables/${encodeURIComponent(name)}`, {
          headers: { 'X-Auth-Token': token }
        });
        if (!res.ok) throw new Error('加载失败');
        currentData = await res.json();
        currentFile = name;
        isDirty = false;
        renderEditor();
        renderFileList();
      } catch (e) {
        showToast('加载文件失败', 'error');
      }
    }

    function showEmpty() {
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('editor-content').classList.add('hidden');
    }

    function renderEditor() {
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('editor-content').classList.remove('hidden');
      document.getElementById('editor-filename').textContent = currentFile;
      document.getElementById('save-status').textContent = '';

      // 渲染表头
      const header = document.getElementById('table-header');
      header.innerHTML = currentData.headers.map(h =>
        `<th>${escapeHtml(h)}</th>`
      ).join('') + '<th class="row-actions"></th>';

      // 渲染行
      renderRows();
    }

    function renderRows() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = currentData.rows.map((row, i) => {
        const cells = currentData.headers.map(h => {
          const val = escapeHtml(row[h] || '');
          const colClass = h === 'Key' ? 'col-key' : h === 'SourceString' ? 'col-source' : 'col-comment';
          return `<td><input class="${colClass}" type="text" value="${val}" data-row="${i}" data-col="${escapeHtml(h)}"></td>`;
        }).join('');
        return `<tr>
          <td class="row-number">${i + 1}</td>
          ${cells}
          <td class="row-actions"><button class="row-delete" data-row="${i}" title="删除行">✕</button></td>
        </tr>`;
      }).join('');

      // 绑定输入事件
      tbody.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', () => {
          const row = parseInt(input.dataset.row);
          const col = input.dataset.col;
          currentData.rows[row][col] = input.value;
          isDirty = true;
          updateSaveStatus('modified');
        });
      });

      // 绑定删除按钮
      tbody.querySelectorAll('.row-delete').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = parseInt(btn.dataset.row);
          currentData.rows.splice(row, 1);
          isDirty = true;
          renderRows();
          updateSaveStatus('modified');
        });
      });
    }

    function updateSaveStatus(state) {
      const el = document.getElementById('save-status');
      el.className = 'save-status ' + state;
      if (state === 'modified') el.textContent = '● 未保存';
      else if (state === 'saving') el.textContent = '保存中...';
      else if (state === 'saved') el.textContent = '✓ 已保存';
      else if (state === 'error') el.textContent = '保存失败';
      else el.textContent = '';
    }

    // 保存
    async function save() {
      if (!currentFile || !currentData) return;
      updateSaveStatus('saving');
      try {
        const res = await fetch(`${API}/api/stringtables/${encodeURIComponent(currentFile)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token },
          body: JSON.stringify(currentData)
        });
        if (!res.ok) throw new Error('保存失败');
        isDirty = false;
        updateSaveStatus('saved');
        showToast('保存成功', 'success');
      } catch (e) {
        updateSaveStatus('error');
        showToast('保存失败', 'error');
      }
    }

    // 添加行
    function addRow() {
      if (!currentData) return;
      const row = {};
      currentData.headers.forEach(h => { row[h] = ''; });
      currentData.rows.push(row);
      isDirty = true;
      renderRows();
      updateSaveStatus('modified');
      // 滚动到底部
      const wrap = document.querySelector('.table-wrap');
      wrap.scrollTop = wrap.scrollHeight;
    }

    // 导出 CSV
    function exportCSV() {
      if (!currentData || !currentFile) return;
      const lines = [currentData.headers.join(',')];
      currentData.rows.forEach(row => {
        const line = currentData.headers.map(h => {
          const val = (row[h] || '').replace(/"/g, '""');
          return val.includes(',') || val.includes('"') || val.includes('\n') ? `"${val}"` : val;
        }).join(',');
        lines.push(line);
      });
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFile;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 导入 CSV
    function importCSV() {
      document.getElementById('csv-file-input').click();
    }

    document.getElementById('csv-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result.replace(/^\uFEFF/, '');
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length === 0) { showToast('CSV 文件为空', 'error'); return; }

        const headers = parseCSVLine(lines[0]).map(h => h.trim());
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const values = parseCSVLine(lines[i]);
          const row = {};
          headers.forEach((h, idx) => { row[h] = (values[idx] || '').trim(); });
          rows.push(row);
        }

        currentData = { headers, rows };
        isDirty = true;
        renderEditor();
        updateSaveStatus('modified');
        showToast(`已导入 ${rows.length} 行`, 'success');
      };
      reader.readAsText(file, 'utf-8');
      e.target.value = '';
    });

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"' && line[i + 1] === '"') { current += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else current += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { result.push(current); current = ''; }
          else current += ch;
        }
      }
      result.push(current);
      return result;
    }

    // 新建文件
    document.getElementById('btn-new').addEventListener('click', () => {
      document.getElementById('new-modal').classList.remove('hidden');
      document.getElementById('new-name').value = '';
      document.getElementById('new-name').focus();
    });

    document.getElementById('new-cancel').addEventListener('click', () => {
      document.getElementById('new-modal').classList.add('hidden');
    });

    document.getElementById('new-confirm').addEventListener('click', async () => {
      const name = document.getElementById('new-name').value.trim();
      if (!name) { showToast('请输入文件名', 'error'); return; }
      try {
        const res = await fetch(API + '/api/stringtables', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          document.getElementById('new-modal').classList.add('hidden');
          showToast('创建成功', 'success');
          await loadFiles();
          openFile(data.name);
        } else {
          showToast(data.error || '创建失败', 'error');
        }
      } catch (e) { showToast('创建失败', 'error'); }
    });

    document.getElementById('new-name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('new-confirm').click();
      if (e.key === 'Escape') document.getElementById('new-modal').classList.add('hidden');
    });

    // 快捷键
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        save();
      }
    });

    // 离开提醒
    window.addEventListener('beforeunload', (e) => {
      if (isDirty) { e.preventDefault(); e.returnValue = ''; }
    });

    // 事件绑定
    document.getElementById('btn-theme').addEventListener('click', toggleTheme);
    document.getElementById('btn-save').addEventListener('click', save);
    document.getElementById('btn-add-row').addEventListener('click', addRow);
    document.getElementById('btn-export-csv').addEventListener('click', exportCSV);
    document.getElementById('btn-import-csv').addEventListener('click', importCSV);

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 初始化
    async function init() {
      loadTheme();
      if (await checkLogin()) {
        await loadFiles();
      }
    }
    init();
  </script>
</body>
</html>
