<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>
    // 反向分流：如果是桌面 UA 或 ?force=desktop，回到 /
    (function(){
      var qs = new URLSearchParams(location.search);
      var force = qs.get('force');
      if (force === 'mobile') return;
      if (force === 'desktop') { location.replace('index.html'); return; }
      var uaMobile = /Android|iPhone|iPod|IEMobile|BlackBerry|Opera Mini/i.test(navigator.userAgent);
      var narrow   = window.matchMedia('(max-width: 820px)').matches;
      var coarse   = window.matchMedia('(pointer: coarse)').matches;
      var isMobile = (uaMobile && coarse) || (narrow && coarse);
      if (!isMobile) location.replace('index.html');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f7f2e8">
  <title>枕书阁</title>
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="m-app noise-bg">
  <!-- 顶栏 -->
  <header class="m-topbar" id="m-topbar">
    <button class="m-icon-btn m-back" id="m-back" aria-label="返回" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="m-title" id="m-title">枕 书 阁</h1>
    <div class="m-topbar-actions">
      <button class="m-icon-btn" id="m-btn-ai" aria-label="AI 助手">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      </button>
      <button class="m-icon-btn" id="m-btn-theme" aria-label="切换主题">
        <svg class="m-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="m-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- 舞台（每个 tab 一个独立的堆栈容器） -->
  <main class="m-stage" id="m-stage">
    <!-- 未登录时显示 -->
    <div class="m-auth-page" id="m-auth-page" hidden>
      <div class="m-auth-card">
        <h2 class="m-auth-title">枕 书 阁</h2>
        <p class="m-auth-subtitle">登录以开始使用</p>
        <div class="m-auth-tabs">
          <button class="m-auth-tab active" data-tab="login">登录</button>
          <button class="m-auth-tab" data-tab="register">注册</button>
        </div>
        <div id="m-login-form" class="m-auth-form">
          <input type="text" class="m-input" id="m-login-username" placeholder="用户名" autocomplete="username">
          <input type="password" class="m-input" id="m-login-password" placeholder="密码" autocomplete="current-password">
          <p class="m-auth-error" id="m-login-error" hidden></p>
          <button class="m-btn-primary" id="m-login-confirm">登录</button>
        </div>
        <div id="m-register-form" class="m-auth-form" hidden>
          <input type="text" class="m-input" id="m-register-username" placeholder="用户名（2-20个字符）" autocomplete="username">
          <input type="password" class="m-input" id="m-register-password" placeholder="密码（至少6位）" autocomplete="new-password">
          <input type="password" class="m-input" id="m-register-password-confirm" placeholder="确认密码" autocomplete="new-password">
          <p class="m-auth-error" id="m-register-error" hidden></p>
          <button class="m-btn-primary" id="m-register-confirm">注册</button>
        </div>
      </div>
    </div>

    <!-- 视图容器：JS 按需渲染 -->
    <div class="m-stack" id="m-stack"></div>
  </main>

  <!-- 底部 tab 栏 -->
  <nav class="m-tabbar" id="m-tabbar">
    <button class="m-tab active" data-tab="notes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span>笔记</span>
    </button>
    <button class="m-tab" data-tab="groups">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span>群组</span>
    </button>
    <button class="m-tab" data-tab="settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <!-- AI 聊天全屏覆盖层 -->
  <div class="m-ai-overlay" id="m-ai-overlay" hidden>
    <header class="m-ai-header">
      <button class="m-icon-btn" id="m-ai-close" aria-label="关闭">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h2 class="m-ai-title">AI 助手</h2>
      <button class="m-icon-btn" id="m-ai-settings-toggle" aria-label="AI 设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </header>
    <div class="m-ai-settings" id="m-ai-settings" hidden>
      <div class="m-ai-settings-row">
        <label>API 地址</label>
        <input type="text" class="m-input" id="m-ai-api-url" placeholder="https://api.openai.com/v1/chat/completions">
      </div>
      <div class="m-ai-settings-row">
        <label>API 密钥</label>
        <input type="password" class="m-input" id="m-ai-api-key" placeholder="sk-...">
      </div>
      <div class="m-ai-settings-row">
        <label>模型</label>
        <input type="text" class="m-input" id="m-ai-model" placeholder="gpt-3.5-turbo">
      </div>
      <button class="m-btn-primary" id="m-ai-save-config">保存配置</button>
    </div>
    <div class="m-ai-messages" id="m-ai-messages">
      <div class="m-ai-msg m-ai-msg-system">
        <p>你好！我是 AI 助手，可以帮你回答关于笔记的问题。</p>
      </div>
    </div>
    <div class="m-ai-input-wrap">
      <textarea class="m-ai-input" id="m-ai-input" placeholder="输入问题…" rows="1"></textarea>
      <button class="m-ai-send" id="m-ai-send" aria-label="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- 简易模态 -->
  <div class="m-modal-overlay" id="m-modal-overlay" hidden>
    <div class="m-modal">
      <p class="m-modal-text" id="m-modal-text"></p>
      <div class="m-modal-input-wrap" id="m-modal-input-wrap" hidden>
        <input type="text" class="m-input" id="m-modal-input">
      </div>
      <div class="m-modal-actions">
        <button class="m-btn-secondary" id="m-modal-cancel">取消</button>
        <button class="m-btn-primary" id="m-modal-confirm">确认</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="m-toast-container" id="m-toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="core.js?v=1"></script>
  <script src="mobile.js?v=1"></script>
</body>
</html>
